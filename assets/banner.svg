<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>

    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="40%" stop-color="#818cf8" />
      <stop offset="70%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#38bdf8" />
      <animate attributeName="x1" values="0%;100%;0%" dur="12s" repeatCount="indefinite" />
      <animate attributeName="x2" values="100%;200%;100%" dur="12s" repeatCount="indefinite" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.8" />
    </linearGradient>

    <linearGradient id="accentLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.1" />
      <stop offset="50%" stop-color="#6366f1" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0.1" />
    </linearGradient>

    <!-- Glowing filters -->
    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="glowPurple" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .title-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 46px;
      letter-spacing: -0.5px;
    }
    .subtitle-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 400;
      font-size: 19px;
      fill: #94a3b8;
    }
    .tagline-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 13px;
      letter-spacing: 2px;
      text-transform: uppercase;
      fill: #38bdf8;
    }
    .card-label {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-size: 13px;
      font-weight: 600;
      fill: #cbd5e1;
    }
    .metric-value {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-size: 15px;
      font-weight: 700;
      fill: #38bdf8;
    }
    .grid-line {
      stroke: #1e293b;
      stroke-width: 1;
      stroke-dasharray: 4 6;
      opacity: 0.6;
    }
  </style>

  <!-- Canvas Background -->
  <rect width="1200" height="420" fill="url(#bgGrad)" rx="16" />

  <!-- Background Grid -->
  <g class="grid-layer">
    <line x1="100" y1="0" x2="100" y2="420" class="grid-line" />
    <line x1="300" y1="0" x2="300" y2="420" class="grid-line" />
    <line x1="500" y1="0" x2="500" y2="420" class="grid-line" />
    <line x1="700" y1="0" x2="700" y2="420" class="grid-line" />
    <line x1="900" y1="0" x2="900" y2="420" class="grid-line" />
    <line x1="1100" y1="0" x2="1100" y2="420" class="grid-line" />
    <line x1="0" y1="100" x2="1200" y2="100" class="grid-line" />
    <line x1="0" y1="200" x2="1200" y2="200" class="grid-line" />
    <line x1="0" y1="300" x2="1200" y2="300" class="grid-line" />
  </g>

  <!-- Ambient Dynamic Glowing Orbs in Deep Background -->
  <g opacity="0.35">
    <circle cx="150" cy="90" r="130" fill="#38bdf8" filter="url(#glowCyan)">
      <animate attributeName="cy" values="90;130;90" dur="8s" repeatCount="indefinite" />
      <animate attributeName="r" values="130;150;130" dur="8s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.25;0.45;0.25" dur="8s" repeatCount="indefinite" />
    </circle>
    <circle cx="1080" cy="320" r="140" fill="#a855f7" filter="url(#glowPurple)">
      <animate attributeName="cx" values="1080;1040;1080" dur="10s" repeatCount="indefinite" />
      <animate attributeName="r" values="140;165;140" dur="10s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.2;0.4;0.2" dur="10s" repeatCount="indefinite" />
    </circle>
    <circle cx="950" cy="90" r="100" fill="#6366f1" filter="url(#glowCyan)">
      <animate attributeName="cy" values="90;60;90" dur="9s" repeatCount="indefinite" />
    </circle>
  </g>

  <!-- Subtle Dynamic Portfolio Flow Lines (Background Network) -->
  <g opacity="0.45">
    <path d="M 80 340 C 300 340, 400 370, 700 350 S 1000 380, 1150 340" fill="none" stroke="url(#accentLine)" stroke-width="2">
      <animate attributeName="stroke-dashoffset" values="0;200;0" dur="12s" repeatCount="indefinite" />
    </path>
  </g>

  <!-- Bottom Visual Cards (Dynamic Status Indicators in lower layer) -->
  <g transform="translate(100, 290)">
    <!-- Card 1: Strategy Alignment -->
    <rect x="0" y="0" width="220" height="76" rx="10" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.2" />
    <circle cx="28" cy="28" r="8" fill="#10b981">
      <animate attributeName="opacity" values="0.6;1;0.6" dur="2.5s" repeatCount="indefinite" />
    </circle>
    <text x="46" y="32" class="card-label">Strategic OKRs</text>
    <text x="46" y="58" class="metric-value">98.4% Matched</text>

    <!-- Card 2: SAFe & Scaled Agile -->
    <rect x="250" y="0" width="220" height="76" rx="10" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.2" />
    <circle cx="278" cy="28" r="8" fill="#38bdf8">
      <animate attributeName="opacity" values="0.6;1;0.6" dur="3s" repeatCount="indefinite" />
    </circle>
    <text x="296" y="32" class="card-label">Program Board (PI)</text>
    <text x="296" y="58" class="metric-value">Cross-Team Sync</text>

    <!-- Card 3: Lean Governance & PPM -->
    <rect x="500" y="0" width="220" height="76" rx="10" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.2" />
    <circle cx="528" cy="28" r="8" fill="#818cf8">
      <animate attributeName="opacity" values="0.6;1;0.6" dur="2s" repeatCount="indefinite" />
    </circle>
    <text x="546" y="32" class="card-label">Capacity &amp; Resources</text>
    <text x="546" y="58" class="metric-value">Real-Time Heatmap</text>

    <!-- Card 4: Open Source & SaaS -->
    <rect x="750" y="0" width="250" height="76" rx="10" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.2" />
    <circle cx="778" cy="28" r="8" fill="#ec4899">
      <animate attributeName="opacity" values="0.6;1;0.6" dur="3.5s" repeatCount="indefinite" />
    </circle>
    <text x="796" y="32" class="card-label">Ecosystem Coverage</text>
    <text x="796" y="58" class="metric-value">SaaS + Open Source</text>
  </g>

  <!-- Foreground Divider Accent Line -->
  <line x1="100" y1="262" x2="1100" y2="262" stroke="url(#accentLine)" stroke-width="2" />

  <!-- MAIN FOREGROUND TEXT (Placed on top so never obscured) -->
  <g transform="translate(100, 0)">
    <!-- Pill Badge -->
    <g transform="translate(0, 48)">
      <rect x="0" y="0" width="310" height="28" rx="14" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2" />
      <circle cx="16" cy="14" r="5" fill="#38bdf8">
        <animate attributeName="opacity" values="0.4;1;0.4" dur="2s" repeatCount="indefinite" />
      </circle>
      <text x="32" y="19" class="tagline-text">Curated Portfolio Intelligence</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="132" class="title-text" fill="url(#titleGrad)">Awesome Agile Portfolio Management</text>

    <!-- Subtitles -->
    <text x="0" y="174" class="subtitle-text">Curated guide to Strategic Portfolio Management (SPM), Lean Portfolio Management (LPM),</text>
    <text x="0" y="204" class="subtitle-text">SAFe Program Boards, Capacity Planning &amp; Top Enterprise SaaS &amp; Open-Source Tools</text>

    <!-- Star Prompt -->
    <g transform="translate(0, 236)">
      <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" fill="#facc15">★ STAR REPO IF HELPFUL</text>
      <text x="175" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="500" fill="#64748b">•</text>
      <text x="190" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="500" fill="#94a3b8">Continuous Delivery at Enterprise Scale</text>
    </g>
  </g>
</svg>
